wallpaper {
    monitor  = eDP-1
    path     = ~/.dotfiles/wallpapers/picture3.png
    fit_mode = cover
}

wallpaper {
    monitor  = DP-1
    path     = ~/.dotfiles/wallpapers/picture3.png
    fit_mode = cover
}

wallpaper {
    monitor  = DP-3
    path     = ~/.dotfiles/wallpapers/picture3.png
    fit_mode = cover
}

# Fallback for any monitor without its own rule (optional). Leave monitor empty.
# wallpaper {
#     monitor  =
#     path     = ~/.dotfiles/wallpapers/picture3.png
#     fit_mode = cover
# }

# enable splash text rendering over the wallpaper
splash = true

# fully disable ipc (ipc is a bool now, default true)
# ipc = false
